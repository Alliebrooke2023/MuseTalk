name: Binks APK

on:
  push:
    paths:
      - "binks/**"
      - ".github/workflows/binks-apk.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: binks/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node copy-web.js
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: binks/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: binks-debug-apk
          path: binks/mobile/android/app/build/outputs/apk/debug/app-debug.apk
